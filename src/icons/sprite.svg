<!-- Sada ikon z původní aplikace. Vytaženo 1:1 z index-original.html.
     Vkládá se do DOM za běhu (src/icons/sprite.js), ne přes <use href="sprite.svg#…">:
     symboly používají var(--card) a currentColor a ty se do externího SVG nepřenesou.
     Ikony se odkazují dvěma způsoby – <use href="#i-van"/> a jako holý řetězec v JS.

     POZOR NA VÝPLNĚ: ikony se do stránky dostávají jako <use>, a do toho stromu
     selektor z dokumentu nedosáhne. Pravidlo `svg.ic .f{fill:currentColor}`
     v base.css se tedy NIKDY neuplatní – uvnitř <use> se zdědí jen `fill:none`
     z `svg.ic`, takže 44 ikon má výplň, která se nikdy nevykreslila (stejně
     jako v původní aplikaci, odkud je to opsané).

     Kdo chce výplň, musí ji napsat jako ATRIBUT na element (`fill="currentColor"`).
     Atribut se do <use> zkopíruje a přebije dědění. Tak to má i i-fire
     (`fill="none" stroke="currentColor"`) a od srpna 2026 i i-star – bez toho
     nebylo vidět hodnocení místa, protože plná a prázdná hvězdička vypadaly stejně. -->
